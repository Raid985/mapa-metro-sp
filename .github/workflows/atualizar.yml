name: Atualizar Rede Metro SP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar atualização com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          async function run() {
            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) throw new Error("GEMINI_API_KEY nao configurada.");
            const dadosAtuais = fs.readFileSync("dados.json", "utf8");
            const hoje = new Date().toISOString().split("T")[0];
            const prompt = `Voce e um especialista em transporte ferroviario de Sao Paulo. Pesquise na internet o status atualizado das obras e operacoes das linhas do Metro, CPTM, ViaQuatro, ViaMobilidade, Linha Uni, Trivia Trens, TIC Trens e Trens Intercidades (TIC) de Sao Paulo ate a data de hoje (${hoje}). Atualize o JSON abaixo movendo estacoes inauguradas para "op", estacoes com obras iniciadas para "build", atualizando porcentagens ("buildPct", "projectPct"), notas ("note") e mudando "DATA_ATUALIZACAO" para "${hoje}". Mantenha EXATAMENTE a mesma estrutura e chaves do JSON original. Responda APENAS com o JSON valido, sem crases markdown ou explicacoes.

JSON ATUAL:
${dadosAtuais}`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ googleSearch: {} }]
              })
            });
            if (!response.ok) throw new Error("Erro Gemini: " + response.status + " " + await response.text());
            const data = await response.json();
            let texto = data.candidates[0].content.parts[0].text;
            texto = texto.replace(/```json/g, "").replace(/```/g, "").trim();
            const jsonValidado = JSON.parse(texto);
            fs.writeFileSync("dados.json", JSON.stringify(jsonValidado, null, 2), "utf8");
            console.log("dados.json atualizado com sucesso para", hoje);
          }
          run().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "Atualizador Automatico"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza dados da rede metroviaria" && git push)
          
