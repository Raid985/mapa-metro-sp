name: Atualizar Rede Metro SP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar atualizacao com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node atualizar.js

      - name: Salvar alteracoes no GitHub
        run: |
          git config user.name "Atualizador Automatico"
          git config user.email "bot@://github.com"
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza dados da rede metroviaria" && git push)

          
